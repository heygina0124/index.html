<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explainer Studio</title>
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #666666; --accent: #3b5bdb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #eeeeee; --muted: #aaaaaa; --accent: #91a7ff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.6;
    }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Explainer Studio</h1>
    <p>준비 중인 페이지입니다.</p>
  </main>
</body>
</html>
